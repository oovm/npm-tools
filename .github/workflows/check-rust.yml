name: Check Rust

# Rust build/test for every delivery crate. TypeScript checks: check-typescript.yml
# Publish: publish-npm.yml on v*.*.* tags.
# `--workspace` is required: root `default-members` only lists uploader and formatter,
# so the publisher (and the other delivered crates) were never proven by this job.
on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

jobs:
  dependency-policy:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-11-07
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-ci-ubuntu-latest
          cache-on-failure: true
      - name: Forbid infrastructure dependency families
        run: node scripts/ci/check-rust-dependency-policy.mjs
      - name: Reject a lock resolved through local paths
        run: node scripts/ci/check-cargo-lock.mjs

  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-11-07
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-ci-${{ matrix.os }}
          cache-on-failure: true
      - name: Build
        run: cargo build --release --workspace --locked
      - name: Tests
        # The script adds `--no-fail-fast` and then asserts that every member's test target
        # emitted a `Running` line. A red job alone cannot prove the other crates executed.
        run: node scripts/ci/run-workspace-tests.mjs
