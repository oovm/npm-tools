name: Check Rust

# Rust build/test only. TypeScript checks: check-typescript.yml
# Publish: publish-npm.yml on v*.*.* tags.
on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-ci-${{ matrix.os }}
          cache-on-failure: true
      - name: Build
        run: cargo build --release
      - name: Tests
        run: cargo test --release
