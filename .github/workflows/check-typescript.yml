name: Check TypeScript

# Nifty format, @doki-land/nifty typecheck and package tests. Rust checks: check-rust.yml
# Publish: publish-npm.yml on v*.*.* tags.
# The package `node --test tests/*.test.mjs` suite must run here: the publish gate
# consumes this workflow, so defineConfig/bump regressions need execution evidence.
on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

jobs:
  typescript:
    name: pnpm packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install
      - run: pnpm run build:napi
      - run: pnpm --filter @doki-land/nifty run build
      - run: pnpm fmt:check
      - run: pnpm --filter @doki-land/nifty run typecheck
      - name: Package tests
        run: pnpm --filter @doki-land/nifty run test
