name: Check TypeScript

# Nifty format, @doki-land/nifty typecheck, package tests and the publish-gate fixtures.
# Rust checks: check-rust.yml. Publish: publish-npm.yml on v*.*.* tags.
# The `pnpm packages` job is a required job of the publish gate
# (`scripts/ci/require-ci-success.mjs`), so defineConfig/bump regressions and the
# gate fixtures must execute here.
on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

jobs:
  typescript:
    name: pnpm packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Release gate fixtures
        run: node --test scripts/ci/*.test.mjs
      - run: pnpm install
      - run: pnpm run build:napi
      - run: pnpm --filter @doki-land/nifty run build
      - run: pnpm fmt:check
      - run: pnpm --filter @doki-land/nifty run typecheck
      - name: Package tests
        run: pnpm --filter @doki-land/nifty run test
