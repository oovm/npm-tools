[package]
name = "nifty-publisher"
version = "0.0.0"
authors = ["Aster <192607617@qq.com>"]
description = "Publish npm workspace packages in dependency order for Nifty hybrid projects"
repository = "https://github.com/oovm/npm-tools"
documentation = "https://docs.rs/nifty-publisher"
readme = "Readme.md"
license = "MPL-2.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
nifty-config = { path = "../nifty-config" }
petgraph = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hmac = "0.12"
sha1 = "0.10"

[dev-dependencies]
tempfile = "3"
