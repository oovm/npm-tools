[package]
name = "nifty-formatter"
version = "0.1.9"
authors = ["Aster <192607617@qq.com>"]
description = "Nifty formatting: gitmoji subjects, release bullets, and changelog sections"
repository = "https://github.com/oovm/npm-tools"
documentation = "https://docs.rs/nifty-formatter"
readme = "Readme.md"
license = "MPL-2.0"
edition = "2021"

[dependencies]
nifty-config = { path = "../nifty-config" }
nifty-types = { path = "../nifty-types" }
oak-typescript = { git = "https://github.com/yggdrasil-language/oak.rs.git", rev = "412f8d47ce6b7fa481e9b64af208c6fae9e02b11" }
serde_json = "1.0"
boost-fs = { workspace = true }

[dev-dependencies]
oak-core = { git = "https://github.com/yggdrasil-language/oak.rs.git", rev = "412f8d47ce6b7fa481e9b64af208c6fae9e02b11" }
oak-javascript = { git = "https://github.com/yggdrasil-language/oak.rs.git", rev = "412f8d47ce6b7fa481e9b64af208c6fae9e02b11" }
oak-testing = { git = "https://github.com/yggdrasil-language/oak.rs.git", rev = "412f8d47ce6b7fa481e9b64af208c6fae9e02b11" }
