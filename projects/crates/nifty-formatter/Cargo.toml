[package]
name = "nifty-formatter"
version = "0.1.3"
authors = ["Aster <192607617@qq.com>"]
description = "Nifty formatting: gitmoji subjects, release bullets, and changelog sections"
repository = "https://github.com/oovm/npm-tools"
documentation = "https://docs.rs/nifty-formatter"
readme = "Readme.md"
license = "MPL-2.0"
edition = "2021"

[dependencies]
nifty-config = { path = "../nifty-config" }
nifty-types = { path = "../nifty-types" }
oak-typescript = { git = "https://github.com/yggdrasil-language/oaks.git", rev = "68304f26fc470f1d05e24e9b856981f21eebee33" }
serde_json = "1.0"
walkdir = "2.5"

[dev-dependencies]
oak-core = { git = "https://github.com/yggdrasil-language/oaks.git", rev = "68304f26fc470f1d05e24e9b856981f21eebee33" }
oak-javascript = { git = "https://github.com/yggdrasil-language/oaks.git", rev = "68304f26fc470f1d05e24e9b856981f21eebee33" }
oak-testing = { git = "https://github.com/yggdrasil-language/oaks.git", rev = "68304f26fc470f1d05e24e9b856981f21eebee33" }
