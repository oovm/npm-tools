[package]
name = "nifty-formatter"
version = "0.0.5"
authors = ["Aster <192607617@qq.com>"]
description = "Nifty formatting: gitmoji subjects, release bullets, and changelog sections"
repository = "https://github.com/oovm/npm-tools"
documentation = "https://docs.rs/nifty-formatter"
readme = "Readme.md"
license = "MPL-2.0"
edition = "2021"

[dependencies]
nifty-config = { path = "../nifty-config" }
nifty-types = { path = "../nifty-types" }
oxc_allocator = { git = "https://github.com/oxc-project/oxc", tag = "oxfmt_v0.70.0" }
oxc_formatter = { git = "https://github.com/oxc-project/oxc", tag = "oxfmt_v0.70.0" }
oxc_formatter_core = { git = "https://github.com/oxc-project/oxc", tag = "oxfmt_v0.70.0" }
oxc_span = { git = "https://github.com/oxc-project/oxc", tag = "oxfmt_v0.70.0" }
serde_json = "1.0"
walkdir = "2.5"

[dev-dependencies]
