[package]
name = "nifty-napi"
version = "0.0.8"
authors = ["Aster <192607617@qq.com>"]
description = "Node-API bindings for Nifty gitmoji and gix helpers"
license = "MPL-2.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi4", "serde-json"] }
napi-derive = "2"
nifty-types = { path = "../nifty-types" }
nifty-formatter = { path = "../nifty-formatter" }
nifty-git = { path = "../nifty-git" }
nifty-github = { path = "../nifty-github" }
nifty-publisher = { path = "../nifty-publisher" }
nifty-history = { path = "../nifty-history" }
nifty-linter = { path = "../nifty-linter" }
nifty-updater = { path = "../nifty-updater" }
gix = { version = "0.68", default-features = false, features = ["revision"] }
serde_json = "1"

[build-dependencies]
napi-build = "2"

[package.metadata.napi]
name = "nifty"
