[package]
name = "nifty-linter"
version = "0.0.12"
authors = ["Aster <192607617@qq.com>"]
description = "Rule-based lint/check for Nifty gitmoji commit conventions and cargo workspace hygiene"
repository = "https://github.com/oovm/npm-tools"
documentation = "https://docs.rs/nifty-linter"
readme = "Readme.md"
license = "MPL-2.0"
edition = "2021"

[dependencies]
nifty-config = { path = "../nifty-config" }
nifty-formatter = { path = "../nifty-formatter" }
nifty-git = { path = "../nifty-git" }
nifty-types = { path = "../nifty-types" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
walkdir = "2.5"

[dev-dependencies]
