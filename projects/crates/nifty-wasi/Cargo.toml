[package]
name = "nifty-wasi"
version = "0.1.0"
authors = ["Aster <192607617@qq.com>"]
description = "WASI Preview 2 component for Nifty gitmoji helpers"
license = "MPL-2.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
nifty-types = { path = "../nifty-types" }
nifty-formatter = { path = "../nifty-formatter" }
nifty-git = { path = "../nifty-git" }
wit-bindgen = "0.41.0"

[target.'cfg(not(target_os = "wasi"))'.dependencies]
nifty-github = { path = "../nifty-github" }

[package.metadata.component]
package = "doki:land"

[package.metadata.component.target]
path = "wit/world.wit"
world = "nifty"
