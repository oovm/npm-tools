[workspace]
members = ["projects/crates/*"]
default-members = [
    "projects/crates/nifty-uploader",
    "projects/crates/nifty-formatter",
]
exclude = [
    "projects/.DS_Store",
]

[workspace.dependencies]
# Overlaid by local path `.cargo/config.toml` (git ignored).
boost-fs = { git = "https://github.com/oovm/rust-boost", branch = "dev" }
boost-log = { git = "https://github.com/oovm/rust-boost", branch = "dev" }
boost-http = { git = "https://github.com/oovm/rust-boost", branch = "dev" }

[profile.release]
lto = true
panic = "abort"
