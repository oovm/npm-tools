[workspace]
members = ["projects/crates/*"]
default-members = [
    "projects/crates/nifty-uploader",
    "projects/crates/nifty-formatter",
]
exclude = [
    "projects/.DS_Store",
]

[workspace.dependencies]
fs-tools = { git = "https://github.com/oovm/rust-boost", branch = "dev" }
request = { git = "https://github.com/oovm/rust-boost", branch = "dev" }

[profile.release]
lto = true
panic = "abort"
