[workspace]
members = ["projects/crates/*"]
default-members = [
    "projects/crates/nifty-uploader",
    "projects/crates/nifty-formatter",
]
exclude = [
    "projects/.DS_Store",
]

[workspace.dependencies]
boost-fs = { path = "../rust-boost/projects/boost-fs" }
boost-log = { path = "../rust-boost/projects/boost-log" }
boost-http = { path = "../rust-boost/projects/boost-http" }

[profile.release]
lto = true
panic = "abort"
