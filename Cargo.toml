[workspace]
resolver = "2"
members = ["projects/crates/*"]
default-members = [
    "projects/crates/nifty-uploader",
    "projects/crates/nifty-formatter",
]
exclude = [
    "projects/.DS_Store",
]

[workspace.dependencies]
# Overlaid by local path `.cargo/config.toml` (git ignored).
boost-fs = { git = "https://github.com/oovm/rust-boost", rev = "71db8fa50f49e3693640cbd19e64ad9c797e5932" }
boost-harness = { git = "https://github.com/oovm/rust-boost", rev = "71db8fa50f49e3693640cbd19e64ad9c797e5932" }
boost-net = { git = "https://github.com/oovm/rust-boost", rev = "71db8fa50f49e3693640cbd19e64ad9c797e5932" }
data-text-core = { git = "https://github.com/oovm/rust-boost", rev = "71db8fa50f49e3693640cbd19e64ad9c797e5932" }
data-text-typescript = { git = "https://github.com/oovm/rust-boost", rev = "71db8fa50f49e3693640cbd19e64ad9c797e5932" }
data-text-javascript = { git = "https://github.com/oovm/rust-boost", rev = "71db8fa50f49e3693640cbd19e64ad9c797e5932" }
language-testing = { git = "https://github.com/oovm/rust-boost", rev = "71db8fa50f49e3693640cbd19e64ad9c797e5932" }

[profile.release]
lto = true
panic = "abort"
