# Copy to `config.toml` (git ignored) and replace `<your-path>` with your local absolute path.
# CI resolves the pinned Boost revision only.

[patch."https://github.com/oovm/rust-boost"]
data-text-core = { path = "<your-path>/rust-boost/projects/data/data.text.core" }
data-text-typescript = { path = "<your-path>/rust-boost/projects/data/data.text.typescript" }
data-text-javascript = { path = "<your-path>/rust-boost/projects/data/data.text.javascript" }
language-testing = { path = "<your-path>/rust-boost/projects/language/language.testing" }
